meters:
- name: platform_subscription
  description: Negotiated Y42 commercial agreement (sales-led; not publicly priced).
  unit: contract
  aggregation: sum
  dimensions:
  - organization
- name: orchestration_runs
  description: Orchestration runs executed across spaces, a driver of warehouse compute consumption.
  unit: runs
  aggregation: sum
  dimensions:
  - organization
  - space
- name: warehouse_compute
  description: >-
    Snowflake / BigQuery compute driven by Y42 pipeline execution, billed by the
    warehouse provider rather than by Y42.
  unit: credits_or_slots
  aggregation: sum
  dimensions:
  - organization
  - space
principles:
- name: Visibility
  description: Track Y42 orchestration run volume alongside Snowflake / BigQuery usage to attribute warehouse spend to pipelines.
- name: Allocation
  description: Map spaces and runs to teams and cost centers; tag warehouse usage by space where the warehouse supports it.
- name: Optimization
  description: Schedule runs to minimize unnecessary warehouse compute; consolidate models and incrementalize dbt builds to reduce warehouse cost.
- name: Accountability
  description: Assign owners per space; review the negotiated Y42 agreement and downstream warehouse spend on a regular cadence.
