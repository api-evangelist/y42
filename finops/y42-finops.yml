- FOCUS
description: >-
  FinOps view of Y42 spend. Y42 is sold through a sales-led, contact-us model
  rather than published usage rates, so its direct platform cost is a negotiated
  commercial agreement. Because Y42 runs on top of the customer's own Snowflake
  or BigQuery warehouse, a material portion of total cost of ownership is the
  underlying warehouse compute and storage driven by Y42 orchestration runs.
  Specific Y42 platform rates are not published and are not reconciled here.
notes: >-
  Y42 platform pricing must be confirmed with Y42 sales. Warehouse compute and
  storage (Snowflake / BigQuery) costs are billed by those providers, not by
  Y42, and should be tracked separately. Verify all figures during reconciliation.
sources:
- https://www.y42.com
