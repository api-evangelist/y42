publisherName: Y42
serviceCategory: Analytics
billingModel:
  pricingCategory: Commitment-Based
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Purchase
focusColumns:
  ServiceName: Y42
  ServiceCategory: Analytics
  ProviderName: Y42
  PublisherName: Y42
  InvoiceIssuerName: Y42
  BillingCurrency: USD
  ChargeCategory: Purchase
