aid: y42
url: https://raw.githubusercontent.com/api-evangelist/y42/refs/heads/main/apis.yml
name: Y42
kind: company
description: Y42 is a managed DataOps platform ("Gitful data ops") that runs production-ready
  data pipelines on top of Snowflake and BigQuery, combining managed Airbyte ingestion,
  managed dbt Core for SQL models, a DAG-based orchestration scheduler, and a managed
  Git backend. Most workflows are driven through the Y42 web app and Git, but Y42
  also exposes a documented public REST API and webhooks for programmatically managing
  spaces, triggering orchestration runs, and retrieving run and manifest information.
